  :root {
    --navy-950: #0a1530;
    --navy-900: #0e1c3f;
    --navy-800: #142751;
    --navy-700: #1b3263;
    --blue-500: #3e5c9a;
    --sky: #a3b9dc;
    --gold: #c6a766;
    --gold-deep: #9c7f45;
    --gold-light: #e6d6ab;
    --ivory: #f4f0e6;
  }
  html, body { margin: 0; padding: 0; background: var(--navy-950); }
  .banner {
    position: relative;
    width: 2400px; height: 1200px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 620px at 1230px 520px, rgba(84,118,186,.30), rgba(84,118,186,0) 70%),
      radial-gradient(ellipse 560px 560px at 380px 520px, rgba(84,118,186,.22), rgba(84,118,186,0) 70%),
      linear-gradient(160deg, var(--navy-800) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    font-family: "Montserrat", sans-serif;
    color: var(--ivory);
  }
  .layer { position: absolute; inset: 0; }

  /* frame */
  .frame { position: absolute; inset: 30px; border: 3px solid rgba(198,167,102,.75); }
  .frame::after { content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(198,167,102,.35); }
  .corner { position: absolute; width: 22px; height: 22px; background: var(--gold); transform: rotate(45deg); }

  /* left column: crest + school name */
  .crest {
    position: absolute; left: 60px; top: 42px; width: 680px; height: 1010px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .crest-ring {
    position: relative; width: 600px; height: 600px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .crest-ring::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(198,167,102,.45);
  }
  .crest-ring::after {
    content: ""; position: absolute; inset: 16px; border-radius: 50%;
    border: 1px dashed rgba(198,167,102,.30);
  }
  .crest img { height: 515px; display: block; position: relative; z-index: 1; }
  .school {
    margin-top: 30px;
    font-family: "Cinzel", serif; font-weight: 800; font-size: 37px; letter-spacing: .03em;
    color: var(--ivory); text-align: center; white-space: nowrap;
  }
  .school-sub {
    margin-top: 14px; display: flex; align-items: center; gap: 18px;
    font-weight: 600; font-size: 22px; letter-spacing: .5em; color: var(--gold);
  }
  .school-sub .rule { width: 70px; height: 2px; background: linear-gradient(90deg, rgba(198,167,102,0), var(--gold)); }
  .school-sub .rule.r { background: linear-gradient(90deg, var(--gold), rgba(198,167,102,0)); }

  /* divider */
  .divider {
    position: absolute; left: 762px; top: 170px; width: 2px; height: 760px;
    background: linear-gradient(180deg, rgba(198,167,102,0), rgba(198,167,102,.8) 30%, rgba(198,167,102,.8) 70%, rgba(198,167,102,0));
  }
  .divider::after {
    content: ""; position: absolute; left: -8px; top: 372px; width: 14px; height: 14px;
    background: var(--gold); transform: rotate(45deg);
  }

  /* centre title block */
  .title {
    position: absolute; left: 782px; top: 42px; width: 1000px; height: 1010px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .welcome {
    font-family: "Great Vibes", cursive; font-size: 132px; line-height: 1; color: var(--gold-light);
    margin-bottom: 14px;
  }
  .big {
    font-family: "Cinzel", serif; font-weight: 900; font-size: 148px; line-height: 1.1;
    letter-spacing: .03em; color: var(--ivory);
    text-shadow: 0 6px 24px rgba(5,10,30,.45);
  }
  .day-row { display: flex; align-items: center; gap: 36px; }
  .day-row .rule { width: 200px; height: 3px; background: linear-gradient(90deg, rgba(198,167,102,0), var(--gold)); position: relative; }
  .day-row .rule.r { background: linear-gradient(90deg, var(--gold), rgba(198,167,102,0)); }
  .day-row .rule::after {
    content: ""; position: absolute; top: -6px; width: 12px; height: 12px; background: var(--gold); transform: rotate(45deg);
  }
  .day-row .rule.l::after { right: -6px; }
  .day-row .rule.r::after { left: -6px; }
  .year {
    margin-top: 34px; padding: 10px 46px 12px;
    border: 2px solid var(--gold); border-radius: 999px;
    font-weight: 700; font-size: 44px; letter-spacing: .32em; color: var(--gold-light);
    padding-left: calc(46px + .32em);
    background: rgba(10,21,48,.35);
  }
  .tagline {
    margin-top: 38px;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600; font-size: 44px;
    color: rgba(244,240,230,.90); letter-spacing: .01em;
  }

  /* right illustration */
  .illus { position: absolute; left: 1806px; top: 140px; width: 552px; height: 828px; }

  /* bottom subjects band */
  .band {
    position: absolute; left: 42px; right: 42px; bottom: 42px; height: 92px;
    background: linear-gradient(180deg, rgba(8,17,40,.55), rgba(8,17,40,.85));
    border-top: 2px solid rgba(198,167,102,.65);
    display: flex; align-items: center; justify-content: center; gap: 34px;
    font-weight: 600; font-size: 27px; letter-spacing: .26em; color: var(--gold-light);
  }
  .band .dot { width: 10px; height: 10px; background: var(--gold); transform: rotate(45deg); flex: none; }
</style>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent && parent.appendChild(n);
    return n;
  };

  // Faint market line + candlesticks across the lower background (seeded, so every render matches)
  (function market() {
    const g = document.getElementById("market");
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pts = [];
    let y = 1050;
    for (let x = 0; x <= 2400; x += 40) {
      y += (rnd() - 0.58) * 26;
      y = Math.max(880, Math.min(1060, y));
      pts.push([x, y]);
    }
    const line = pts.map(p => p.join(",")).join(" ");
    el("polygon", { points: `0,1200 ${line} 2400,1200`, fill: "url(#areaFill)" }, g);
    el("polyline", { points: line, fill: "none", stroke: "#c6a766", "stroke-opacity": ".30", "stroke-width": 3, "stroke-linejoin": "round" }, g);
    pts.forEach(([x, yy], i) => {
      if (i % 2) return;
      const up = rnd() > 0.4;
      const h = 18 + rnd() * 40;
      const top = yy - 30 - h - rnd() * 20;
      const c = up ? "#a3b9dc" : "#c6a766";
      el("line", { x1: x, y1: top - 14, x2: x, y2: top + h + 14, stroke: c, "stroke-opacity": ".09", "stroke-width": 2 }, g);
      el("rect", { x: x - 7, y: top, width: 14, height: h, fill: c, "fill-opacity": ".08" }, g);
    });
  })();

  // Coin stacks
  (function coins() {
    const g = document.getElementById("coins");
    const stack = (cx, baseY, n, rx, ry, th, label) => {
      for (let i = 0; i < n; i++) {
        const cy = baseY - i * th;
        el("path", {
          d: `M${cx - rx} ${cy - th} L${cx - rx} ${cy} A${rx} ${ry} 0 0 0 ${cx + rx} ${cy} L${cx + rx} ${cy - th} Z`,
          fill: "url(#coinSide)", stroke: "#6e5730", "stroke-width": 1.5
        }, g);
        el("ellipse", { cx, cy: cy - th, rx, ry, fill: "url(#coinTop)", stroke: "#8c7140", "stroke-width": 1.5 }, g);
      }
      const topY = baseY - (n - 1) * th - th;
      el("ellipse", { cx, cy: topY, rx: rx * 0.72, ry: ry * 0.72, fill: "none", stroke: "#8c7140", "stroke-width": 2 }, g);
      if (label) {
        const t = el("text", {
          x: cx, y: topY + ry * 0.32, "text-anchor": "middle", "font-family": "Cinzel, serif", "font-weight": 900,
          "font-size": ry * 1.05, fill: "#7a6036", transform: `translate(0 ${topY}) scale(1 .62) translate(0 ${-topY})`
        }, g);
        t.textContent = label;
      }
    };
    stack(110, 716, 7, 80, 24, 20, "Rs");
    stack(225, 724, 3, 62, 19, 17, "");
  })();
</script>
